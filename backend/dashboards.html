<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboards - Hoja de Ruta 6</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    header {
      color: white;
      margin-bottom: 30px;
      text-align: center;
    }
    
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    .subtitle {
      font-size: 1.1em;
      opacity: 0.9;
    }
    
    .dashboards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }
    
    .card h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.5em;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    
    th {
      background: #f5f5f5;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #667eea;
    }
    
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    
    tr:hover {
      background: #f9f9f9;
    }
    
    .loading {
      text-align: center;
      padding: 30px;
      color: #999;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
      border-left: 4px solid #c33;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    
    .stat {
      flex: 1;
      min-width: 200px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .stat-label {
      font-size: 0.9em;
      color: #999;
      margin-bottom: 5px;
    }
    
    .stat-value {
      font-size: 1.6em;
      font-weight: bold;
      color: #333;
    }
    
    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s ease;
    }
    
    .refresh-btn:hover {
      background: #764ba2;
    }
    
    .refresh-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .currency {
      color: #27ae60;
      font-weight: 600;
    }
    
    footer {
      text-align: center;
      color: white;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Dashboards Hoja de Ruta 6</h1>
      <p class="subtitle">Actualizando datos cada 5 minutos desde SAP</p>
    </header>
    
    <div class="dashboards">
      <!-- Hoja de Asesor -->
      <div class="card">
        <h2>👤 Hoja de Asesor</h2>
        <button class="refresh-btn" onclick="loadAsesores()">Actualizar</button>
        <div id="asesor-loading" class="loading">
          <div class="spinner"></div>
          Cargando...
        </div>
        <div id="asesor-content" style="display:none;">
          <div class="stats" id="asesor-stats"></div>
          <table id="asesor-table"></table>
        </div>
        <div id="asesor-error" class="error" style="display:none;"></div>
      </div>

      <!-- Hoja de Cliente -->
      <div class="card">
        <h2>🏢 Hoja de Cliente</h2>
        <button class="refresh-btn" onclick="loadClientes()">Actualizar</button>
        <div id="cliente-loading" class="loading">
          <div class="spinner"></div>
          Cargando...
        </div>
        <div id="cliente-content" style="display:none;">
          <table id="cliente-table"></table>
        </div>
        <div id="cliente-error" class="error" style="display:none;"></div>
      </div>

      <!-- Labor Comercial -->
      <div class="card">
        <h2>💼 Labor Comercial</h2>
        <button class="refresh-btn" onclick="loadLabor()">Actualizar</button>
        <div id="labor-loading" class="loading">
          <div class="spinner"></div>
          Cargando...
        </div>
        <div id="labor-content" style="display:none;">
          <div class="stats" id="labor-stats"></div>
          <table id="labor-table"></table>
        </div>
        <div id="labor-error" class="error" style="display:none;"></div>
      </div>

      <!-- Portafolio y Cartera -->
      <div class="card">
        <h2>📈 Portafolio y Cartera</h2>
        <button class="refresh-btn" onclick="loadPortafolio()">Actualizar</button>
        <div id="portafolio-loading" class="loading">
          <div class="spinner"></div>
          Cargando...
        </div>
        <div id="portafolio-content" style="display:none;">
          <table id="portafolio-table"></table>
        </div>
        <div id="portafolio-error" class="error" style="display:none;"></div>
      </div>

      <!-- Planeacion Nogales -->
      <div class="card">
        <h2>🗺️ Planeación Nogales</h2>
        <button class="refresh-btn" onclick="loadPlaneacion()">Actualizar</button>
        <div id="planeacion-loading" class="loading">
          <div class="spinner"></div>
          Cargando...
        </div>
        <div id="planeacion-content" style="display:none;">
          <div class="stats" id="planeacion-stats"></div>
          <table id="planeacion-table"></table>
        </div>
        <div id="planeacion-error" class="error" style="display:none;"></div>
      </div>
    </div>

    <footer>
      <p>✓ Backend: <span id="backend-status">Verificando...</span> | Última actualización: <span id="last-update">-</span></p>
    </footer>
  </div>

  <script>
    const API_BASE = 'https://tu-backend-render.app'; // ← Cambiar a tu URL de Render
    
    function formatCurrency(value) {
      return new Intl.NumberFormat('es-MX', {
        style: 'currency',
        currency: 'MXN'
      }).format(value);
    }

    function updateLastUpdate() {
      const now = new Date().toLocaleTimeString('es-MX');
      document.getElementById('last-update').textContent = now;
    }

    async function checkBackendStatus() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (res.ok) {
          document.getElementById('backend-status').textContent = '✓ En línea';
          document.getElementById('backend-status').style.color = '#27ae60';
        } else {
          throw new Error('Backend not responding');
        }
      } catch (err) {
        document.getElementById('backend-status').textContent = '✗ Offline';
        document.getElementById('backend-status').style.color = '#e74c3c';
      }
    }

    async function loadAsesores() {
      const section = 'asesor';
      showLoading(section);
      try {
        const res = await fetch(`${API_BASE}/dashboards/hoja-asesor`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { data } = await res.json();

        const stats = {
          total_asesores: data.length,
          total_monto: data.reduce((s, r) => s + (r.total_monto || 0), 0),
          avg_facturas: Math.round(data.reduce((s, r) => s + r.total_facturas, 0) / data.length)
        };

        let html = `
          <div class="stat">
            <div class="stat-label">Total Asesores</div>
            <div class="stat-value">${stats.total_asesores}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Total Monto</div>
            <div class="stat-value">${formatCurrency(stats.total_monto)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Promedio Facturas</div>
            <div class="stat-value">${stats.avg_facturas}</div>
          </div>
        `;
        document.getElementById('asesor-stats').innerHTML = html;

        html = '<tr><th>Asesor</th><th>Facturas</th><th>Monto Total</th><th>Promedio</th></tr>';
        data.forEach(row => {
          html += `<tr>
            <td>${row.asesor || '-'}</td>
            <td>${row.total_facturas}</td>
            <td class="currency">${formatCurrency(row.total_monto)}</td>
            <td class="currency">${formatCurrency(row.promedio_monto)}</td>
          </tr>`;
        });
        document.getElementById('asesor-table').innerHTML = html;
        showContent(section);
      } catch (err) {
        showError(section, err.message);
      }
      updateLastUpdate();
    }

    async function loadClientes() {
      const section = 'cliente';
      showLoading(section);
      try {
        const res = await fetch(`${API_BASE}/dashboards/hoja-cliente`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { data } = await res.json();

        let html = '<tr><th>Cliente</th><th>Facturas</th><th>Monto Total</th><th>Última Factura</th></tr>';
        data.forEach(row => {
          const fecha = new Date(row.ultima_factura).toLocaleDateString('es-MX');
          html += `<tr>
            <td>${row.cliente || '-'}</td>
            <td>${row.total_facturas}</td>
            <td class="currency">${formatCurrency(row.total_monto)}</td>
            <td>${fecha}</td>
          </tr>`;
        });
        document.getElementById('cliente-table').innerHTML = html;
        showContent(section);
      } catch (err) {
        showError(section, err.message);
      }
      updateLastUpdate();
    }

    async function loadLabor() {
      const section = 'labor';
      showLoading(section);
      try {
        const res = await fetch(`${API_BASE}/dashboards/labor-comercial`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { data } = await res.json();

        const stats = {
          total_labores: data.length,
          total_monto: data.reduce((s, r) => s + (r.total_monto || 0), 0)
        };

        let html = `
          <div class="stat">
            <div class="stat-label">Tipos de Labor</div>
            <div class="stat-value">${stats.total_labores}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Total Monto</div>
            <div class="stat-value">${formatCurrency(stats.total_monto)}</div>
          </div>
        `;
        document.getElementById('labor-stats').innerHTML = html;

        html = '<tr><th>Labor Comercial</th><th>Facturas</th><th>Monto Total</th></tr>';
        data.forEach(row => {
          html += `<tr>
            <td>${row.labor_comercial || '-'}</td>
            <td>${row.total_facturas}</td>
            <td class="currency">${formatCurrency(row.total_monto)}</td>
          </tr>`;
        });
        document.getElementById('labor-table').innerHTML = html;
        showContent(section);
      } catch (err) {
        showError(section, err.message);
      }
      updateLastUpdate();
    }

    async function loadPortafolio() {
      const section = 'portafolio';
      showLoading(section);
      try {
        const res = await fetch(`${API_BASE}/dashboards/portafolio-cartera`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { data } = await res.json();

        let html = '<tr><th>Portafolio</th><th>Cartera</th><th>Facturas</th><th>Monto Total</th></tr>';
        data.forEach(row => {
          html += `<tr>
            <td>${row.portafolio || '-'}</td>
            <td>${row.cartera || '-'}</td>
            <td>${row.total_facturas}</td>
            <td class="currency">${formatCurrency(row.total_monto)}</td>
          </tr>`;
        });
        document.getElementById('portafolio-table').innerHTML = html;
        showContent(section);
      } catch (err) {
        showError(section, err.message);
      }
      updateLastUpdate();
    }

    async function loadPlaneacion() {
      const section = 'planeacion';
      showLoading(section);
      try {
        const res = await fetch(`${API_BASE}/dashboards/planeacion-nogales`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { data } = await res.json();

        const stats = {
          total_items: data.length,
          total_monto: data.reduce((s, r) => s + (r.total_monto || 0), 0)
        };

        let html = `
          <div class="stat">
            <div class="stat-label">Elementos</div>
            <div class="stat-value">${stats.total_items}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Total Monto</div>
            <div class="stat-value">${formatCurrency(stats.total_monto)}</div>
          </div>
        `;
        document.getElementById('planeacion-stats').innerHTML = html;

        html = '<tr><th>Planeación</th><th>Facturas</th><th>Monto Total</th></tr>';
        data.forEach(row => {
          html += `<tr>
            <td>${row.planeacion || '-'}</td>
            <td>${row.total_facturas}</td>
            <td class="currency">${formatCurrency(row.total_monto)}</td>
          </tr>`;
        });
        document.getElementById('planeacion-table').innerHTML = html;
        showContent(section);
      } catch (err) {
        showError(section, err.message);
      }
      updateLastUpdate();
    }

    function showLoading(section) {
      document.getElementById(`${section}-loading`).style.display = 'block';
      document.getElementById(`${section}-content`).style.display = 'none';
      document.getElementById(`${section}-error`).style.display = 'none';
    }

    function showContent(section) {
      document.getElementById(`${section}-loading`).style.display = 'none';
      document.getElementById(`${section}-content`).style.display = 'block';
      document.getElementById(`${section}-error`).style.display = 'none';
    }

    function showError(section, message) {
      document.getElementById(`${section}-loading`).style.display = 'none';
      document.getElementById(`${section}-content`).style.display = 'none';
      document.getElementById(`${section}-error`).style.display = 'block';
      document.getElementById(`${section}-error`).textContent = `❌ Error: ${message}`;
    }

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      checkBackendStatus();
      loadAsesores();
      loadClientes();
      loadLabor();
      loadPortafolio();
      loadPlaneacion();

      // Refresh cada 5 minutos
      setInterval(() => {
        loadAsesores();
        loadClientes();
        loadLabor();
        loadPortafolio();
        loadPlaneacion();
      }, 300000);
    });
  </script>
</body>
</html>
