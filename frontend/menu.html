<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMACERO | Menú</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon/android-chrome-512x512.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #e0b8ae1e;
            color: #202124;
        }

        body {
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 76px;
            background: #ffffff;
            border-bottom: 3px solid #c8102e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 42px;
        }

        .brand {
            display: flex;
            align-items: center;
            width: 210px;
        }

      .brand img {
    width: 65%;
    height: auto;
    display: block;
    object-fit: contain;
    filter: brightness(0) saturate(100%)
            invert(15%) sepia(89%)
            saturate(4048%) hue-rotate(343deg)
            brightness(83%) contrast(92%);
}

        .user-area {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 13px;
            color: #c8102e;
        }

        .user-name {
            font-weight: 700;
            color: #333333;
        }

        .logout {
            border: 1px solid #c8102e;
            background: #ffffff;
            color: #c8102e;
            border-radius: 6px;
            padding: 9px 16px;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
        }

        .logout:hover {
            background: #c8102e;
            color: #ffffff;
        }

        .content {
            width: min(1050px, calc(100% - 40px));
            margin: 0 auto;
            padding: 58px 0;
        }

        .welcome {
            margin-bottom: 34px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: #222222;
        }

        .welcome p {
            color: #777777;
            font-size: 14px;
        }

        .red-line {
            width: 52px;
            height: 4px;
            background: #c8102e;
            border-radius: 5px;
            margin-top: 16px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .menu-button {
            min-height: 165px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            background: #ffffff;
            padding: 28px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
            transition: .22s ease;
        }

        .menu-button:hover {
            transform: translateY(-3px);
            border-color: #c8102e;
            box-shadow: 0 10px 28px rgba(200,16,46,.10);
        }

        .icon {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #fff1f3;
            color: #c8102e;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .menu-button h2 {
            font-size: 18px;
            color: #252525;
            margin-bottom: 7px;
        }

        .menu-button p {
            font-size: 13px;
            color: #858585;
            line-height: 1.5;
        }

        .footer {
            margin-top: 48px;
            text-align: center;
            font-size: 11px;
            color: #ec0000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 650px) {
            .header {
                height: auto;
                min-height: 70px;
                padding: 15px 20px;
                gap: 15px;
            }

            .brand {
                width: 175px;
            }

            .user-area {
                gap: 8px;
            }

            .user-name {
                display: none;
            }

            .content {
                width: min(100% - 28px, 500px);
                padding: 35px 0;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .menu-button {
                min-height: 135px;
            }
        }
    
</style>
</head>

<body>

    <div class="page">

        <header class="header">
            <div class="brand">
                <img src="assets/formacero.webp" alt="Logo Formacero">
            </div>

            <div class="user-area">
                <span>Usuario: <span class="user-name" id="userName">Usuario</span></span>
                <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </header>

        <main class="content">
            <section class="welcome">
                <h1>Menú principal</h1>
                <p>Selecciona una opción para continuar.</p>
                <div class="red-line"></div>
            </section>

            <section class="menu-grid">

                <button class="menu-button" onclick="window.location.href='Panorama de Produccion - Tuberia.html'">
                  <div class="icon">01</div>
                  <h2>Panorama de Producción · Tubería y Perfilería</h2>
                  <p>panorama.</p>
                </button>
                
                <button class="menu-button" onclick="abrirModulo('creditos')">
                    <div class="icon">02</div>
                    <h2>Créditos</h2>
                    <p>Gestionar solicitudes y operaciones de crédito.</p>
                </button>

                <button class="menu-button" onclick="abrirModulo('pagos')">
                    <div class="icon">03</div>
                    <h2>Pagos</h2>
                    <p>Registrar y consultar pagos realizados.</p>
                </button>

                <button class="menu-button" onclick="abrirModulo('reportes')">
                    <div class="icon">04</div>
                    <h2>Reportes</h2>
                    <p>Consultar información y generar reportes del sistema.</p>
                </button>

            </section>

            <div class="footer">
                Sistema de gestión · FORMACERO
            </div>
        </main>
    </div>

    <script>
        const token = sessionStorage.getItem("formacero_token");
        const usuario = sessionStorage.getItem("formacero_usuario");

        if (!token) {
            window.location.replace("login.html");
        }

        if (usuario) {
            document.getElementById("userName").textContent = usuario;
        }

        function abrirModulo(modulo) {
            // Estos botones quedan preparados para conectar cada módulo después.
            const nombres = {
                clientes: "Clientes",
                creditos: "Créditos",
                pagos: "Pagos",
                reportes: "Reportes"
            };

            alert("Módulo " + nombres[modulo] + " listo para conectar.");
        }

        function cerrarSesion() {
            sessionStorage.removeItem("formacero_usuario");
            sessionStorage.removeItem("formacero_token");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
