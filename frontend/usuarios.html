<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Usuarios y permisos · La Campana</title><link rel="icon" href="favicon.png"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#171b20;font-family:Inter,Arial,sans-serif}.top{background:#c9151e;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:28px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e2e4e6;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 8px 24px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d8dcdf;border-radius:8px}.perms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.perm{padding:9px;border:1px solid #e0e2e4;border-radius:8px;font-size:12px}.actions{display:flex;gap:8px;margin-top:15px}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer}.primary{background:#c9151e;color:#fff}.secondary{background:#eceff1}.danger{background:#fff0f0;color:#a00}.user{border-top:1px solid #eee;padding:16px 0;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.badge{font-size:10px;font-weight:900;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:#eee}.small{font-size:12px;color:#6d747b}.denied{text-align:center;padding:60px;font-weight:800}@media(max-width:800px){.grid,.perms{grid-template-columns:1fr}.user{flex-direction:column}}</style><script src="auth-guard.js"></script></head><body><div class="top"><strong>La Campana · Usuarios y permisos</strong><button class="btn secondary" onclick="location.href='menu.html'">Volver al menú</button></div><div class="wrap"><div class="panel"><h2>Agregar usuario</h2><p class="small">Cada persona puede tener permisos diferentes aunque tenga el mismo rol.</p><form id="form"><div class="grid"><div class="field"><label>Nombre completo</label><input id="nombre" required></div><div class="field"><label>Usuario</label><input id="username" required placeholder="ej. juan.perez"></div><div class="field"><label>Contraseña</label><input id="password" type="password" required minlength="6"></div><div class="field"><label>Rol</label><select id="rol"><option value="gerencia">Gerencia</option><option value="comercio">Comercio</option><option value="produccion">Producción</option><option value="admin">Admin</option></select></div></div><h3>Permisos de páginas</h3><div class="actions"><button type="button" class="btn secondary" onclick="marcarRol()">Cargar permisos del rol</button><button type="button" class="btn secondary" onclick="marcarTodos()">Todas</button><button type="button" class="btn secondary" onclick="quitarTodos()">Ninguna</button></div><div id="perms" class="perms"></div><div class="actions"><button class="btn primary">Crear usuario</button></div></form></div><div class="panel"><h2>Usuarios existentes</h2><div id="lista">Cargando...</div></div></div><script>
const API_BASE='https://prueba-d9ro.onrender.com/api',TOKEN_KEY='panorama_access_token';let paginas=[],roles={};
function headers(){return {'Content-Type':'application/json',Authorization:'Bearer '+sessionStorage.getItem(TOKEN_KEY)}}
function pintarPermisos(selected=[]){document.getElementById('perms').innerHTML=paginas.map(p=>`<label class="perm"><input type="checkbox" value="${p}" ${selected.includes(p)?'checked':''}> ${({"panorama-produccion":"Producción","panorama-comercial":"Labor Comercial","hoja-asesor":"Hoja de Asesor","hoja-despacho":"Hoja de Despacho","hoja-ruta-cliente":"Hoja de Cliente","hoja-sede":"Hoja de Sede","panorama-produccion-diaria":"Producción Diaria","panorama-portafolio":"Portafolio y Cartera","planeacion-nogales":"Planeación Nogales","costos-produccion":"Costos de Producción","analisis-inventario":"Análisis Inventario","panorama-compras":"Panorama de Compras","usuarios":"Usuarios y Permisos"}[p]||p)}</label>`).join('')}
function seleccionados(){return [...document.querySelectorAll('#perms input:checked')].map(x=>x.value)}
function marcarRol(){pintarPermisos(roles[document.getElementById('rol').value]||[])}function marcarTodos(){pintarPermisos(paginas)}function quitarTodos(){pintarPermisos([])}
async function init(){const r=await fetch(API_BASE+'/auth/roles',{headers:headers()});if(r.status===403){document.body.innerHTML='<div class="denied">Solo un administrador puede administrar usuarios.</div>';return}const d=await r.json();paginas=d.paginas;roles=d.permisosPorRol;pintarPermisos(roles.gerencia||[]);cargar()}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const body={nombre:nombre.value,username:username.value,password:password.value,rol:rol.value,permisos:seleccionados()};const r=await fetch(API_BASE+'/auth/users',{method:'POST',headers:headers(),body:JSON.stringify(body)});const d=await r.json();if(!r.ok)return alert(d.message||'No se pudo crear');alert('Usuario creado correctamente');e.target.reset();pintarPermisos(roles.gerencia||[]);cargar()}
async function cargar(){const r=await fetch(API_BASE+'/auth/users',{headers:headers()});const d=await r.json();if(!r.ok)return;lista.innerHTML=d.usuarios.map(u=>`<div class="user"><div><strong>${esc(u.nombre)}</strong><div class="small">${esc(u.username)} · <span class="badge">${esc(u.rol)}</span> · ${u.activo?'Activo':'Inactivo'}</div><div class="small">${u.permisos.length} páginas permitidas</div></div><div class="actions"><button class="btn secondary" onclick='editar(${JSON.stringify(u)})'>Editar permisos</button><button class="btn danger" onclick="eliminar('${u.id}')">Eliminar</button></div></div>`).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function editar(u){const nuevo=prompt('Permisos separados por coma.

'+paginas.map(p=>`${u.permisos.includes(p)?'[X]':'[ ]'} ${p}`).join('
')+'

Escribe las páginas permitidas separadas por coma:',u.permisos.join(','));if(nuevo===null)return;const ps=nuevo.split(',').map(x=>x.trim()).filter(Boolean);const r=await fetch(API_BASE+'/auth/users/'+u.id,{method:'PUT',headers:headers(),body:JSON.stringify({permisos:ps})});const d=await r.json();if(!r.ok)alert(d.message||'Error');else cargar()}
async function eliminar(id){if(!confirm('¿Eliminar este usuario?'))return;const r=await fetch(API_BASE+'/auth/users/'+id,{method:'DELETE',headers:headers()});const d=await r.json();if(!r.ok)alert(d.message||'Error');else cargar()}
init();</script></body></html>
