<!DOCTYPE html>

<html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hoja de Asesor</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .contenedor {
        width: 95%;
        max-width: 1500px;
        margin: 30px auto;
    }

    .encabezado {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    .encabezado h1 {
        margin: 0 0 8px 0;
        font-size: 30px;
    }

    .encabezado p {
        margin: 0;
        color: #666;
    }

    .filtros {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        align-items: end;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .campo {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .campo label {
        font-weight: bold;
        font-size: 14px;
    }

    .campo input {
        height: 42px;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
    }

    button {
        height: 42px;
        padding: 0 22px;
        border: none;
        border-radius: 7px;
        background: #1f6feb;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #1558b0;
    }

    button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    .estado {
        margin-bottom: 20px;
        padding: 12px 15px;
        border-radius: 8px;
        display: none;
        font-weight: bold;
    }

    .estado.cargando {
        display: block;
        background: #fff3cd;
        color: #856404;
    }

    .estado.exito {
        display: block;
        background: #d1e7dd;
        color: #0f5132;
    }

    .estado.error {
        display: block;
        background: #f8d7da;
        color: #842029;
    }

    .resumen {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 15px;
        margin-bottom: 20px;
    }

    .tarjeta {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tarjeta .titulo {
        font-size: 13px;
        color: #777;
        margin-bottom: 10px;
    }

    .tarjeta .valor {
        font-size: 24px;
        font-weight: bold;
    }

    .tabla-contenedor {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        overflow: hidden;
    }

    .tabla-header {
        padding: 20px;
        border-bottom: 1px solid #eee;
    }

    .tabla-header h2 {
        margin: 0;
        font-size: 21px;
    }

    .tabla-scroll {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
    }

    th {
        background: #f1f3f5;
        padding: 14px;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
    }

    td {
        padding: 13px 14px;
        border-top: 1px solid #eee;
        font-size: 14px;
    }

    tbody tr:hover {
        background: #f8f9fa;
    }

    .derecha {
        text-align: right;
    }

    .centrado {
        text-align: center;
    }

    .sin-datos {
        text-align: center;
        padding: 40px;
        color: #777;
    }

    @media (max-width: 1100px) {
        .resumen {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .contenedor {
            width: 94%;
        }

        .resumen {
            grid-template-columns: 1fr;
        }

        .filtros {
            align-items: stretch;
            flex-direction: column;
        }

        .campo input,
        button {
            width: 100%;
        }
    }
</style>

</head>

<body>

<div class="contenedor">

<div class="encabezado">
    <h1>Hoja de Asesor</h1>
    <p>Información comercial consolidada desde SAP / PostgreSQL</p>
</div>

<div class="filtros">

    <div class="campo">
        <label for="fechaInicio">Fecha inicial</label>
        <input type="date" id="fechaInicio">
    </div>

    <div class="campo">
        <label for="fechaFin">Fecha final</label>
        <input type="date" id="fechaFin">
    </div>

    <button id="btnActualizar" onclick="cargarHojaAsesor()">
        Actualizar
    </button>

</div>

<div id="estado" class="estado"></div>

<div class="resumen">

    <div class="tarjeta">
        <div class="titulo">Total líneas</div>
        <div class="valor" id="totalLineas">0</div>
    </div>

    <div class="tarjeta">
        <div class="titulo">Total facturas</div>
        <div class="valor" id="totalFacturas">0</div>
    </div>

    <div class="tarjeta">
        <div class="titulo">Total monto</div>
        <div class="valor" id="totalMonto">$0</div>
    </div>

    <div class="tarjeta">
        <div class="titulo">Total pagado</div>
        <div class="valor" id="totalPagado">$0</div>
    </div>

    <div class="tarjeta">
        <div class="titulo">Total kilos</div>
        <div class="valor" id="totalKilos">0</div>
    </div>

</div>

<div class="tabla-contenedor">

    <div class="tabla-header">
        <h2>Detalle por asesor</h2>
    </div>

    <div class="tabla-scroll">

        <table>

            <thead>
                <tr>
                    <th>Asesor</th>
                    <th class="centrado">Líneas</th>
                    <th class="centrado">Facturas</th>
                    <th class="derecha">Monto</th>
                    <th class="derecha">Pagado</th>
                    <th class="derecha">% Pagado</th>
                    <th class="derecha">Kilos</th>
                    <th class="derecha">Valor/Kilo</th>
                    <th class="centrado">Líneas pagadas</th>
                </tr>
            </thead>

            <tbody id="tablaAsesores">

                <tr>
                    <td colspan="9" class="sin-datos">
                        Cargando información...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>

<script> // ========================================================= // CONFIGURACIÓN DEL BACKEND // ========================================================= const API_URL = 'https://prueba-k6t5.onrender.com'; // ========================================================= // ELEMENTOS // ========================================================= const fechaInicio = document.getElementById('fechaInicio'); const fechaFin = document.getElementById('fechaFin'); const btnActualizar = document.getElementById('btnActualizar'); const estado = document.getElementById('estado'); const tabla = document.getElementById('tablaAsesores'); // ========================================================= // FECHAS POR DEFECTO // ========================================================= function establecerFechas() { fechaInicio.value = '2026-08-27'; fechaFin.value = '2026-08-27'; } // ========================================================= // FORMATO MONEDA // ========================================================= function formatoMoneda(valor) { const numero = Number(valor) || 0; return numero.toLocaleString( 'es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 } ); } // ========================================================= // FORMATO NÚMERO // ========================================================= function formatoNumero(valor, decimales = 0) { const numero = Number(valor) || 0; return numero.toLocaleString( 'es-CO', { minimumFractionDigits: decimales, maximumFractionDigits: decimales } ); } // ========================================================= // MOSTRAR ESTADO // ========================================================= function mostrarEstado(mensaje, tipo) { estado.textContent = mensaje; estado.className = 'estado ' + tipo; } // ========================================================= // LIMPIAR RESUMEN // ========================================================= function limpiarResumen() { document.getElementById( 'totalLineas' ).textContent = '0'; document.getElementById( 'totalFacturas' ).textContent = '0'; document.getElementById( 'totalMonto' ).textContent = '$0'; document.getElementById( 'totalPagado' ).textContent = '$0'; document.getElementById( 'totalKilos' ).textContent = '0'; } // ========================================================= // CARGAR HOJA DE ASESOR // ========================================================= async function cargarHojaAsesor() { const inicio = fechaInicio.value; const fin = fechaFin.value; if (!inicio || !fin) { mostrarEstado( 'Seleccione las fechas de consulta.', 'error' ); return; } if (inicio > fin) { mostrarEstado( 'La fecha inicial no puede ser mayor que la fecha final.', 'error' ); return; } btnActualizar.disabled = true; btnActualizar.textContent = 'Consultando...'; mostrarEstado( 'Consultando información de Hoja de Asesor...', 'cargando' ); tabla.innerHTML = ` <tr> <td colspan="9" class="sin-datos"> Consultando información... </td> </tr> `; try { const url = `${API_URL}/dashboards/hoja-asesor` + `?inicio=${encodeURIComponent(inicio)}` + `&fin=${encodeURIComponent(fin)}`; console.log( 'Consultando Hoja de Asesor:', url ); const response = await fetch(url); if (!response.ok) { throw new Error( `Error HTTP ${response.status}` ); } const resultado = await response.json(); console.log( 'Respuesta Hoja de Asesor:', resultado ); if (resultado.ok === false) { throw new Error( resultado.error || 'El backend respondió con error' ); } const datos = Array.isArray(resultado.data) ? resultado.data : []; renderizarDatos(datos); mostrarEstado( `Información actualizada correctamente. ${datos.length} asesores encontrados.`, 'exito' ); } catch (error) { console.error( 'Error cargando Hoja de Asesor:', error ); limpiarResumen(); tabla.innerHTML = ` <tr> <td colspan="9" class="sin-datos"> No fue posible cargar la información. </td> </tr> `; mostrarEstado( 'No se pudo conectar con el backend: ' + error.message, 'error' ); } finally { btnActualizar.disabled = false; btnActualizar.textContent = 'Actualizar'; } } // ========================================================= // RENDERIZAR DATOS // ========================================================= function renderizarDatos(datos) { limpiarResumen(); if (!datos.length) { tabla.innerHTML = ` <tr> <td colspan="9" class="sin-datos"> No hay información para el período seleccionado. </td> </tr> `; return; } let totalLineas = 0; let totalFacturas = 0; let totalMonto = 0; let totalPagado = 0; let totalKilos = 0; datos.forEach(asesor => { totalLineas += Number( asesor.total_lineas ) || 0; totalFacturas += Number( asesor.total_facturas ) || 0; totalMonto += Number( asesor.total_monto ) || 0; totalPagado += Number( asesor.total_pagado ) || 0; totalKilos += Number( asesor.total_kilos ) || 0; }); document.getElementById( 'totalLineas' ).textContent = formatoNumero(totalLineas); document.getElementById( 'totalFacturas' ).textContent = formatoNumero(totalFacturas); document.getElementById( 'totalMonto' ).textContent = formatoMoneda(totalMonto); document.getElementById( 'totalPagado' ).textContent = formatoMoneda(totalPagado); document.getElementById( 'totalKilos' ).textContent = formatoNumero( totalKilos, 2 ); tabla.innerHTML = ''; datos.forEach(asesor => { const monto = Number( asesor.total_monto ) || 0; const pagado = Number( asesor.total_pagado ) || 0; const porcentaje = monto > 0 ? ( pagado / monto * 100 ) : 0; const fila = document.createElement('tr'); fila.innerHTML = ` <td> ${escaparHTML( asesor.asesor || 'Sin asesor' )} </td> <td class="centrado"> ${formatoNumero( asesor.total_lineas )} </td> <td class="centrado"> ${formatoNumero( asesor.total_facturas )} </td> <td class="derecha"> ${formatoMoneda(monto)} </td> <td class="derecha"> ${formatoMoneda(pagado)} </td> <td class="derecha"> ${formatoNumero( porcentaje, 2 )}% </td> <td class="derecha"> ${formatoNumero( asesor.total_kilos, 2 )} </td> <td class="derecha"> ${formatoNumero( asesor.promedio_valor_kilo, 2 )} </td> <td class="centrado"> ${formatoNumero( asesor.lineas_pagadas )} </td> `; tabla.appendChild(fila); }); } // ========================================================= // SEGURIDAD HTML // ========================================================= function escaparHTML(texto) { return String(texto) .replace(/&/g, '&amp;') .replace(/</g, '&lt;') .replace(/>/g, '&gt;') .replace(/"/g, '&quot;') .replace(/'/g, '&#039;'); } // ========================================================= // INICIO AUTOMÁTICO // ========================================================= document.addEventListener( 'DOMContentLoaded', () => { establecerFechas(); cargarHojaAsesor(); } ); </script>

</body> </html>
