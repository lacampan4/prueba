<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FORMACERO - Sistema de Gestión">
  <meta name="theme-color" content="#c8102e">
  <title>FORMACERO | Sistema de Gestión</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon/android-chrome-512x512.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #1d1d1d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .loader {
      width: min(420px, calc(100% - 40px));
      text-align: center;
      animation: appear .45s ease forwards;
    }
    .top-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: #c8102e;
    }
    .brand {
      color: #c8102e;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }
    .title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #777;
      font-size: 13px;
    }
    .bar {
      width: 100%;
      height: 3px;
      margin-top: 28px;
      background: #eee;
      overflow: hidden;
      border-radius: 4px;
    }
    .bar::after {
      content: "";
      display: block;
      width: 35%;
      height: 100%;
      background: #c8102e;
      animation: loading 1s infinite ease-in-out;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fallback {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }
    .fallback a { color: #c8102e; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="top-line"></div>

  <main class="loader" aria-live="polite">
    <div class="brand">FORMACERO</div>
    <div class="title">Sistema de Gestión</div>
    <div class="subtitle">Cargando el acceso al sistema...</div>
    <div class="bar" aria-hidden="true"></div>
    <div class="fallback">
      Si no eres redirigido automáticamente,
      <a href="login.html">haz clic aquí para ingresar</a>.
    </div>
  </main>

  <script>
    // Si ya existe una sesión, el usuario puede ir directamente al menú.
    // De lo contrario, se muestra primero el login.
    const token = sessionStorage.getItem("formacero_token");
    const destino = token ? "inicio.html" : "login.html";

    setTimeout(() => {
      window.location.replace(destino);
    }, 500);
  </script>
</body>
</html>
